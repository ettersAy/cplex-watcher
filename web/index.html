<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Cineplex Watcher</title>
    <link rel="stylesheet" href="styles.css?v=20260913-4">
  </head>
  <body>
    <section id="access-gate" class="access-gate" hidden>
      <form id="access-form" class="panel">
        <p>This is a personal app. Please enter your access token.</p>
        <label for="access-token">UI access token</label>
        <input id="access-token" name="token" type="password" autocomplete="current-password" placeholder="Enter your private token" required>
        <button type="submit">Open Cineplex Watcher</button>
        <p id="access-result" class="result" role="status"></p>
      </form>
    </section>

    <main id="app" hidden>
      <header>
        <p class="eyebrow">Personal ticket availability monitor</p>
        <h1>Cineplex Watcher</h1>
        <p class="intro">See active movie watches and submit one movie title per line for Cineplex lookup.</p>
      </header>

      <section class="panel" aria-labelledby="add-watch-heading">
        <h2 id="add-watch-heading">Add a movie</h2>
        <form id="queue-form">
          <label for="movie-titles">Movie titles</label>
          <textarea id="movie-titles" name="titles" maxlength="1410" rows="5" placeholder="Runner&#10;George Michael: The Faith Tour" required></textarea>
          <button type="submit">Queue movies</button>
        </form>
        <p id="queue-result" class="result" role="status"></p>
      </section>

      <section class="panel" aria-labelledby="watches-heading">
        <div class="section-heading">
          <div>
            <h2 id="watches-heading">Active watches</h2>
            <p class="hint">Data is refreshed from the watcher repository.</p>
          </div>
          <div class="actions">
            <button id="scan" class="secondary" type="button">Scan all</button>
            <button id="refresh" class="secondary" type="button">Refresh</button>
          </div>
        </div>
        <p id="load-status" class="result" role="status">Loading watches…</p>
        <p id="scan-result" class="result" role="status"></p>
        <div id="watches" class="watches"></div>
      </section>
    </main>
    <script src="app.js?v=20260913-4"></script>
  </body>
</html>
