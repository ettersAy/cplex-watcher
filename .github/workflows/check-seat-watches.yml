name: Check Cineplex seat watches

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: scan, create, edit, stop, delete, add_showtime, stop_showtime, refresh, or watch_preview
        required: false
        default: scan
        type: string
      watch_id:
        description: Existing seat-watch identifier
        required: false
        type: string
      payload:
        description: JSON configuration payload
        required: false
        type: string
      request_id:
        description: Worker request identifier
        required: false
        type: string
      chat_id:
        description: Telegram command-result recipient
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: seat-watch-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply seat-watch command
        id: command
        if: github.event_name == 'workflow_dispatch' && inputs.operation != 'scan'
        continue-on-error: true
        env:
          SEAT_OPERATION: ${{ inputs.operation }}
          SEAT_WATCH_ID: ${{ inputs.watch_id }}
          SEAT_PAYLOAD: ${{ inputs.payload }}
        run: python seat_watch_command.py "$SEAT_OPERATION" --watch-id "$SEAT_WATCH_ID" --payload "$SEAT_PAYLOAD" > command-result.json

      - name: Scan configured seat watches
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'scan' || ((inputs.operation == 'create' || inputs.operation == 'edit' || inputs.operation == 'add_showtime' || inputs.operation == 'refresh' || inputs.operation == 'watch_preview') && steps.command.outcome == 'success')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
        run: python seat_watcher.py scan --notify ${{ inputs.operation == 'refresh' && format('--watch-id {0}', inputs.watch_id) || '' }}

      - name: Send command result to Telegram
        if: github.event_name == 'workflow_dispatch' && inputs.operation != 'scan' && inputs.chat_id != '' && always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_RECIPIENTS: ${{ inputs.chat_id }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          from pathlib import Path
          from seat_watch_command import command_result_html
          from watcher import send_telegram

          try:
              result = json.loads(Path("command-result.json").read_text())
              text = f"❌ <b>Seat-watch request failed</b>\n\n{html.escape(result['error'])}" if result.get("error") else command_result_html(result)
          except (OSError, json.JSONDecodeError, KeyError) as error:
              text = f"❌ <b>Seat-watch request failed</b>\n\n{html.escape(str(error))}"
          send_telegram(os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_RECIPIENTS"], text, parse_mode="HTML")
          PY

      - name: Save seat-watch state and logs
        run: |
          git config user.name "Cineplex Seat Watcher"
          git config user.email "actions@github.com"
          git add seat-watches.json seat-watch-state.json available-seat-list.json seat-watch.log
          if ! git diff --cached --quiet; then
            git commit -m "Update seat watcher state"
            if ! git pull --rebase origin main; then
              git rebase --abort
              echo "::warning::Discarded stale scan state because a newer seat-watch edit changed the same files. The next scheduled scan will use the newer configuration."
              exit 0
            fi
            git push origin HEAD:main
          fi
