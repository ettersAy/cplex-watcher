name: Check Cineplex ticket sales

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      title:
        description: Movie title requested through Telegram
        required: true
        type: string
      request_id:
        description: Worker request identifier
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find requested movie
        if: github.event_name == 'workflow_dispatch'
        env:
          WATCH_TITLE: ${{ inputs.title }}
        run: python register_watch.py "$WATCH_TITLE" > registration.json

      - name: Show registration outcome
        if: github.event_name == 'workflow_dispatch' && always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          try:
              result = json.loads(Path("registration.json").read_text())
          except (OSError, json.JSONDecodeError) as error:
              print(f"Registration result unavailable: {error}")
          else:
              print(f"Registration status: {result.get('status')}")
              if result.get("movie"):
                  print(f"Matched movie: {result['movie'].get('name')}")
                  print(f"Matched URL: {result['movie'].get('url')}")
              if result.get("error"):
                  print(f"Registration error: {result['error']}")
          PY

      - name: Save requested movie
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("registration.json").read_text())
          if result["status"] != "watching":
              raise SystemExit(0)

          movies_path = Path("movies.json")
          movies = json.loads(movies_path.read_text())
          movie = result["movie"]
          url = movie["url"]
          if any(existing["url"] == url for existing in movies):
              result["status"] = "already_watching"
              Path("registration.json").write_text(json.dumps(result) + "\n")
              print(f"Movie is already watched: {url}")
          else:
              movies.append({"url": url, "name": movie["name"]})
              movies_path.write_text(json.dumps(movies, indent=2) + "\n")
              print(f"Added watched movie: {url}")
          PY

      - name: Check movies and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Send registration result to Telegram
        if: github.event_name == 'workflow_dispatch' && always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from watcher import send_telegram

          try:
              result = json.loads(Path("registration.json").read_text())
          except (OSError, json.JSONDecodeError) as error:
              result = {"status": "error", "error": f"GitHub registration failed: {error}"}
          if result.get("status") == "watching":
              movie = result["movie"]
              text = f"Started watching {movie['name']}.\nNext check: within 30 minutes.\n{movie['url']}"
          elif result.get("status") == "already_watching":
              movie = result["movie"]
              text = f"Already watching {movie['name']}.\n{movie['url']}"
          elif result.get("status") == "already_on_sale":
              movie = result["movie"]
              text = f"Tickets are already on sale for {movie['name']}.\n{movie['url']}"
          else:
              text = result.get("error", "I could not complete the Cineplex search.")
          send_telegram(os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_CHAT_ID"], text)
          print(f"Telegram registration result sent: status={result.get('status')}")
          PY

      - name: Save alert state
        run: |
          git config user.name "Cineplex Ticket Watcher"
          git config user.email "actions@github.com"
          git add movies.json state.json
          git diff --cached --quiet || git commit -m "Update ticket watcher state"
          git push
