name: Check Cineplex ticket sales

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      title:
        description: Movie title requested through Telegram
        required: true
        type: string
      request_id:
        description: Worker request identifier
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find requested movie
        if: github.event_name == 'workflow_dispatch'
        env:
          WATCH_TITLE: ${{ inputs.title }}
        run: python register_watch.py "$WATCH_TITLE" > registration.json

      - name: Save requested movie
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("registration.json").read_text())
          if result["status"] != "watching":
              raise SystemExit(0)

          movies_path = Path("movies.json")
          movies = json.loads(movies_path.read_text())
          url = result["movie"]["url"]
          if not any(movie["url"] == url for movie in movies):
              movies.append({"url": url})
              movies_path.write_text(json.dumps(movies, indent=2) + "\n")
          PY

      - name: Check movies and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Report registration result to Worker
        if: github.event_name == 'workflow_dispatch' && always()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_CALLBACK_URL: ${{ secrets.WORKER_CALLBACK_URL }}
          WATCHER_CALLBACK_SECRET: ${{ secrets.WATCHER_CALLBACK_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          try:
              result = json.loads(Path("registration.json").read_text())
          except (OSError, json.JSONDecodeError) as error:
              result = {"status": "error", "error": f"GitHub registration failed: {error}"}
          result["request_id"] = os.environ["REQUEST_ID"]
          request = Request(
              os.environ["WORKER_CALLBACK_URL"],
              data=json.dumps(result).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-Watcher-Callback-Secret": os.environ["WATCHER_CALLBACK_SECRET"],
              },
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(f"Worker callback returned HTTP {response.status}")
          PY

      - name: Save alert state
        run: |
          git config user.name "Cineplex Ticket Watcher"
          git config user.email "actions@github.com"
          git add movies.json state.json
          git diff --cached --quiet || git commit -m "Update ticket watcher state"
          git push
