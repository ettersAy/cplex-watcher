name: Check Cineplex ticket sales

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      title:
        description: One movie title requested through Telegram (legacy single-title input)
        required: false
        type: string
      titles:
        description: Newline-separated movie titles requested through the web interface
        required: false
        type: string
      operation:
        description: watch, remove, or remove_by_title
        required: false
        default: watch
        type: string
      url:
        description: Canonical Cineplex URL to remove when operation is remove
        required: false
        type: string
      request_id:
        description: Worker request identifier
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find requested movies
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'watch'
        env:
          WATCH_TITLES: ${{ inputs.titles || inputs.title }}
        run: python register_watch.py --many "$WATCH_TITLES" > registration.json

      - name: Show registration outcome
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'watch' && always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          try:
              result = json.loads(Path("registration.json").read_text())
          except (OSError, json.JSONDecodeError) as error:
              print(f"Registration result unavailable: {error}")
          else:
              for item in result.get("results", [result]):
                  print(f"Registration status: {item.get('status')}")
                  if item.get("movie"):
                      print(f"Matched movie: {item['movie'].get('name')}")
                      print(f"Matched URL: {item['movie'].get('url')}")
                  if item.get("error"):
                      print(f"Registration error: {item['error']}")
          PY

      - name: Save requested movies
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'watch'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          registration_path = Path("registration.json")
          registration = json.loads(registration_path.read_text())
          results = registration.get("results", [registration])
          movies_path = Path("movies.json")
          sales_started_path = Path("sales-started.json")
          movies = json.loads(movies_path.read_text())
          sales_started = json.loads(sales_started_path.read_text()) if sales_started_path.exists() else []
          changed = False
          for result in results:
              if result["status"] == "watching":
                  movie = result["movie"]
                  url = movie["url"]
                  if any(existing["url"] == url for existing in movies):
                      result["status"] = "already_watching"
                      print(f"Movie is already watched: {url}")
                  else:
                      movies.append({"url": url, "name": movie["name"]})
                      changed = True
                      print(f"Added watched movie: {url}")
              elif result["status"] == "already_on_sale":
                  movie = result["movie"]
                  if not any(existing["url"] == movie["url"] for existing in sales_started):
                      sales_started.append({
                          "url": movie["url"],
                          "name": movie["name"],
                          "salesStartedAt": datetime.now(timezone.utc).isoformat(),
                      })
                      changed = True
                      print(f"Added sales-started movie: {movie['url']}")
          if changed:
              movies_path.write_text(json.dumps(movies, indent=2) + "\n")
              sales_started_path.write_text(json.dumps(sales_started, indent=2) + "\n")
          registration_path.write_text(json.dumps(registration) + "\n")
          PY

      - name: Remove requested movie
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'remove' || inputs.operation == 'remove_by_title')
        env:
          WATCH_URL: ${{ inputs.url }}
          WATCH_OPERATION: ${{ inputs.operation }}
          WATCH_TITLE: ${{ inputs.title }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          operation = os.environ["WATCH_OPERATION"]
          movies_path = Path("movies.json")
          sales_started_path = Path("sales-started.json")
          state_path = Path("state.json")
          movies = json.loads(movies_path.read_text())
          sales_started = json.loads(sales_started_path.read_text()) if sales_started_path.exists() else []
          state = json.loads(state_path.read_text()) if state_path.exists() else {"movies": {}}
          if operation == "remove_by_title":
              def normalise(value):
                  return "".join(character for character in value.lower() if character.isalnum())

              query = normalise(os.environ["WATCH_TITLE"])
              candidates = []
              for movie in movies:
                  slug = movie["url"].rstrip("/").rsplit("/", 1)[-1]
                  name = movie.get("name") or state["movies"].get(slug, {}).get("name") or slug.replace("-", " ")
                  if query and query in normalise(name):
                      candidates.append({**movie, "name": name})
              if len(candidates) == 1:
                  targets = candidates
                  removal_results = []
              elif len(candidates) > 1:
                  targets = []
                  removal_results = [{"removed": False, "movie": {"name": os.environ["WATCH_TITLE"]}, "error": "Several active watches match that title. Use the web page to stop the exact movie."}]
              else:
                  targets = []
                  removal_results = [{"removed": False, "movie": {"name": os.environ["WATCH_TITLE"]}}]
          else:
              targets = [{"url": os.environ["WATCH_URL"]}]
              removal_results = []

          for target in targets:
              url = target["url"]
              removed = [movie for movie in movies if movie["url"] == url]
              movies = [movie for movie in movies if movie["url"] != url]
              removed_sales_started = [movie for movie in sales_started if movie["url"] == url]
              sales_started = [movie for movie in sales_started if movie["url"] != url]
              state["movies"].pop(url.rstrip("/").rsplit("/", 1)[-1], None)
              removed_movie = removed[0] if removed else (removed_sales_started[0] if removed_sales_started else target)
              removal_results.append({"removed": bool(removed or removed_sales_started), "movie": removed_movie})
          if any(item["removed"] for item in removal_results):
              movies_path.write_text(json.dumps(movies, indent=2) + "\n")
              sales_started_path.write_text(json.dumps(sales_started, indent=2) + "\n")
          state_path.write_text(json.dumps(state, indent=2) + "\n")
          Path("removal.json").write_text(json.dumps({"results": removal_results}) + "\n")
          print(f"Removed watches: {sum(item['removed'] for item in removal_results)}")
          PY

      - name: Check movies and notify Telegram
        if: github.event_name != 'workflow_dispatch' || (inputs.operation != 'remove' && inputs.operation != 'remove_by_title')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Send registration result to Telegram
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'watch' && always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from watcher import send_telegram

          try:
              result = json.loads(Path("registration.json").read_text())
          except (OSError, json.JSONDecodeError) as error:
              result = {"results": [{"status": "error", "error": f"GitHub registration failed: {error}"}]}
          for item in result.get("results", [result]):
              if item.get("status") == "watching":
                  movie = item["movie"]
                  text = f"Started watching {movie['name']}.\nNext check: within 30 minutes.\n{movie['url']}"
              elif item.get("status") == "already_watching":
                  movie = item["movie"]
                  text = f"Already watching {movie['name']}.\n{movie['url']}"
              elif item.get("status") == "already_on_sale":
                  movie = item["movie"]
                  text = f"Tickets are already on sale for {movie['name']}.\n{movie['url']}"
              else:
                  text = item.get("error", "I could not complete the Cineplex search.")
              send_telegram(os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_CHAT_ID"], text)
              print(f"Telegram registration result sent: status={item.get('status')}")
          PY

      - name: Send removal result to Telegram
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'remove' || inputs.operation == 'remove_by_title') && always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from watcher import send_telegram

          try:
              result = json.loads(Path("removal.json").read_text())
          except (OSError, json.JSONDecodeError) as error:
              text = f"Could not stop the watch: {error}"
          else:
              for item in result.get("results", [result]):
                  movie = item["movie"]
                  name = movie.get("name") or movie.get("url") or "the requested movie"
                  if item.get("error"):
                      text = item["error"]
                  else:
                      text = f"Stopped watching {name}." if item["removed"] else f"No active watch found for {name}."
                  send_telegram(os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_CHAT_ID"], text)
                  print("Telegram removal result sent")
          PY

      - name: Save alert state
        run: |
          git config user.name "Cineplex Ticket Watcher"
          git config user.email "actions@github.com"
          git add movies.json sales-started.json state.json
          git diff --cached --quiet || git commit -m "Update ticket watcher state"
          git push
