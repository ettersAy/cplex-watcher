name: Check Cineplex ticket sales
run-name: ${{ inputs.operation == 'check' && format('Ticket check {0}', inputs.request_id) || 'Check Cineplex ticket sales' }}

on:
  schedule:
    # Cloudflare is primary; keep an off-peak fallback in each half-hour.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      title:
        description: One movie title requested through Telegram (legacy single-title input)
        required: false
        type: string
      titles:
        description: Newline-separated movie titles requested through the web interface
        required: false
        type: string
      operation:
        description: watch, check, remove, remove_by_title, unfollow, keep, or cancel
        required: false
        default: watch
        type: string
      url:
        description: Canonical Cineplex URL to remove when operation is remove
        required: false
        type: string
      request_id:
        description: Worker request identifier
        required: true
        type: string
      chat_id:
        description: Telegram chat to receive this command's final result
        required: false
        type: string
      confirmation_expires:
        description: Verified confirmation expiry in milliseconds
        required: false
        type: string
      recipient_key:
        description: Opaque Telegram account identifier for a personal subscription and reply
        required: false
        type: string

concurrency:
  group: ticket-watch-state-write
  queue: max

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Each queued command reads the watches saved by the previous run.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find requested movies
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'watch'
        env:
          WATCH_TITLES: ${{ inputs.titles || inputs.title }}
        run: python register_watch.py --many "$WATCH_TITLES" > registration.json

      - name: Show registration outcome
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'watch' && always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          try:
              result = json.loads(Path("registration.json").read_text())
          except (OSError, json.JSONDecodeError) as error:
              print(f"Registration result unavailable: {error}")
          else:
              for item in result.get("results", [result]):
                  print(f"Registration status: {item.get('status')}")
                  if item.get("movie"):
                      print(f"Matched movie: {item['movie'].get('name')}")
                      print(f"Matched URL: {item['movie'].get('url')}")
                  if item.get("error"):
                      print(f"Registration error: {item['error']}")
          PY

      - name: Save requested movies
        id: registration
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'watch'
        env:
          RECIPIENT_KEY: ${{ inputs.recipient_key }}
          TELEGRAM_PREFERENCES_KEY: ${{ secrets.TELEGRAM_PREFERENCES_KEY }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from register_watch import save_registration

          registration_path = Path("registration.json")
          registration = json.loads(registration_path.read_text())
          save_registration(Path("."), registration, os.environ["RECIPIENT_KEY"])
          registration_path.write_text(json.dumps(registration) + "\n")
          PY

      - name: Remove requested movie
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'remove' || inputs.operation == 'remove_by_title')
        env:
          WATCH_URL: ${{ inputs.url }}
          WATCH_OPERATION: ${{ inputs.operation }}
          WATCH_TITLE: ${{ inputs.title }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          operation = os.environ["WATCH_OPERATION"]
          movies_path = Path("movies.json")
          sales_started_path = Path("sales-started.json")
          state_path = Path("state.json")
          movies = json.loads(movies_path.read_text())
          sales_started = json.loads(sales_started_path.read_text()) if sales_started_path.exists() else []
          state = json.loads(state_path.read_text()) if state_path.exists() else {"movies": {}}
          if operation == "remove_by_title":
              # Retired Telegram route: old Workers must not remove everyone's watch during rollout.
              targets = []
              removal_results = [{"removed": False, "movie": {"name": os.environ["WATCH_TITLE"]},
                                  "error": "Nothing changed. Send the stop command again to receive a confirmation."}]
          else:
              targets = [{"url": os.environ["WATCH_URL"]}]
              removal_results = []

          for target in targets:
              url = target["url"]
              removed = [movie for movie in movies if movie["url"] == url]
              movies = [movie for movie in movies if movie["url"] != url]
              removed_sales_started = [movie for movie in sales_started if movie["url"] == url]
              sales_started = [movie for movie in sales_started if movie["url"] != url]
              state["movies"].pop(url.rstrip("/").rsplit("/", 1)[-1], None)
              removed_movie = removed[0] if removed else (removed_sales_started[0] if removed_sales_started else target)
              removal_results.append({"removed": bool(removed or removed_sales_started), "movie": removed_movie})
          if any(item["removed"] for item in removal_results):
              movies_path.write_text(json.dumps(movies, indent=2) + "\n")
              sales_started_path.write_text(json.dumps(sales_started, indent=2) + "\n")
          state_path.write_text(json.dumps(state, indent=2) + "\n")
          Path("removal.json").write_text(json.dumps({"results": removal_results}) + "\n")
          print(f"Removed watches: {sum(item['removed'] for item in removal_results)}")
          PY

      - name: Apply confirmed personal unfollow
        id: unfollow
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'unfollow' || inputs.operation == 'keep' || inputs.operation == 'cancel')
        env:
          RECIPIENT_KEY: ${{ inputs.recipient_key }}
          TARGET_SLUG: ${{ inputs.title }}
          CONFIRMATION_NONCE: ${{ inputs.request_id }}
          KEEP_WATCH: ${{ inputs.operation == 'keep' }}
          CANCEL_WATCH: ${{ inputs.operation == 'cancel' }}
          CONFIRMATION_EXPIRES: ${{ inputs.confirmation_expires }}
          TELEGRAM_PREFERENCES_KEY: ${{ secrets.TELEGRAM_PREFERENCES_KEY }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ticket_membership import unfollow
          outcome = unfollow(Path("."), os.environ["RECIPIENT_KEY"], os.environ["TARGET_SLUG"],
                             os.environ["CONFIRMATION_NONCE"], int(os.environ["CONFIRMATION_EXPIRES"]),
                             keep=os.environ["KEEP_WATCH"] == "true", cancel=os.environ["CANCEL_WATCH"] == "true")
          Path("unfollow-result.json").write_text(json.dumps(outcome))
          PY

      - name: Check movies and notify Telegram
        if: github.event_name == 'schedule' || inputs.operation == 'watch' || inputs.operation == 'check'
        env:
          TICKET_CHECK_REQUEST: ${{ github.event_name == 'schedule' && 'fallback' || (inputs.operation == 'check' && inputs.request_id || '') }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PREFERENCES_KEY: ${{ secrets.TELEGRAM_PREFERENCES_KEY }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS }}
        run: python ticket_check.py

      - name: Save alert state
        id: save
        if: always()
        run: |
          git config user.name "Cineplex Ticket Watcher"
          git config user.email "actions@github.com"
          git add movies.json sales-started.json state.json
          if git diff --cached --quiet; then
            echo "No ticket-watch state changes to save"
            exit 0
          fi
          git commit -m "Update ticket watcher state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} was rejected; rebasing state commit onto latest main"
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not save ticket-watch state after three attempts" >&2
          exit 1

      - name: Send registration result to Telegram
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'watch' && always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS }}
          TELEGRAM_PREFERENCES_KEY: ${{ secrets.TELEGRAM_PREFERENCES_KEY }}
          RECIPIENT_KEY: ${{ inputs.recipient_key }}
          COMMAND_CHAT_ID: ${{ inputs.chat_id }}
          REGISTRATION_SAVED: ${{ steps.registration.outcome == 'success' && steps.save.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from watcher import movie_slug, send_telegram
          from notification_preferences import configured_recipients, load_preferences, watches_enabled
          from ticket_membership import notify_friend_change

          key = os.environ["RECIPIENT_KEY"]
          chat_ids = configured_recipients()[2][key] if key else os.environ["COMMAND_CHAT_ID"] or os.environ["TELEGRAM_RECIPIENTS"]
          preference = load_preferences(Path(".")).get(key, {})
          try:
              result = json.loads(Path("registration.json").read_text())
          except (OSError, json.JSONDecodeError) as error:
              result = {"results": [{"status": "error", "error": f"GitHub registration failed: {error}"}]}
          for item in result.get("results", [result]):
              saved = os.environ["REGISTRATION_SAVED"] == "true"
              status = item.get("status")
              if not saved:
                  text = "I could not save your watch. Please try again shortly."
              elif status in ("watching", "already_watching"):
                  movie = item["movie"]
                  alerts_on = watches_enabled(preference, f"ticket:{movie_slug(movie['url'])}")
                  if status == "already_watching":
                      audience = "ticket alert list" if alerts_on else "watch list"
                      text = f"{movie['name']} is already being checked. You were already on its {audience}."
                  elif item.get("membership_added"):
                      audience = "ticket alerts" if alerts_on else "watch list"
                      action = "Checking is back on for" if item.get("was_dormant") else "Already checking"
                      text = f"{action} {movie['name']}. I added you to its {audience}."
                  else:
                      text = f"Started watching {movie['name']}.\nNext check: within 30 minutes."
                  if not alerts_on:
                      reason = "all alerts are paused" if preference.get("stoppedAll") else "alerts are paused for this title"
                      text += f"\nYour alerts are paused ({reason}). Use /start all to resume your alerts."
                  text += f"\n{movie['url']}"
              elif status == "already_on_sale":
                  movie = item["movie"]
                  text = f"Tickets are already on sale for {movie['name']}.\n{movie['url']}"
              else:
                  text = item.get("error", "I could not complete the Cineplex search.")
              try:
                  send_telegram(os.environ["TELEGRAM_BOT_TOKEN"], chat_ids, text)
                  print(f"Telegram registration result sent: status={item.get('status')}")
              finally:
                  if os.environ["REGISTRATION_SAVED"] == "true" and item.get("friend_started"):
                      notify_friend_change(Path("."), item, os.environ["TELEGRAM_BOT_TOKEN"], send_telegram)
          PY

      - name: Report personal unfollow after persistence
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'unfollow' || inputs.operation == 'keep' || inputs.operation == 'cancel') && always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PREFERENCES_KEY: ${{ secrets.TELEGRAM_PREFERENCES_KEY }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_GEORGE_MICHAEL_ALERT_CHAT_IDS }}
          RECIPIENT_KEY: ${{ inputs.recipient_key }}
          UNFOLLOW_SAVED: ${{ steps.unfollow.outcome == 'success' && steps.save.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from notification_preferences import configured_recipients
          from ticket_membership import notify_friend_change
          from watcher import send_telegram

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          requester = configured_recipients()[2].get(os.environ["RECIPIENT_KEY"])
          if not requester:
              raise SystemExit("Unrecognized recipient")
          saved = os.environ["UNFOLLOW_SAVED"] == "true"
          outcome = json.loads(Path("unfollow-result.json").read_text()) if saved else {"status": "failed"}
          status = outcome["status"]
          if status != "duplicate":
              if status == "unfollowed":
                  text = f"You stopped following {outcome['name']}. Other people's watches did not change."
              elif status == "kept":
                  text = f"You're still following {outcome['name']}. Your alert settings did not change."
              elif status == "cancelled":
                  text = "Cancelled. Nothing changed."
              elif status == "expired":
                  text = "This confirmation expired. Nothing changed."
              elif status == "unchanged":
                  text = "You no longer had an active watch for this movie. Nothing changed."
              else:
                  text = "I could not save the change. Please try again."
              # A requester send failure must not block the independent admin notice.
              try:
                  send_telegram(token, requester, text)
              finally:
                  if status == "unfollowed":
                      notify_friend_change(Path("."), outcome, token, send_telegram)
          PY

      - name: Send removal result to Telegram
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'remove' || inputs.operation == 'remove_by_title') && always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_RECIPIENTS: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from watcher import send_telegram

          try:
              result = json.loads(Path("removal.json").read_text())
          except (OSError, json.JSONDecodeError) as error:
              text = f"Could not stop the watch: {error}"
          else:
              for item in result.get("results", [result]):
                  movie = item["movie"]
                  name = movie.get("name") or movie.get("url") or "the requested movie"
                  if item.get("error"):
                      text = item["error"]
                  else:
                      text = f"Stopped watching {name}." if item["removed"] else f"No active watch found for {name}."
                  send_telegram(os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_RECIPIENTS"], text)
                  print("Telegram removal result sent")
          PY
